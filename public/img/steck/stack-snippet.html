<!-- 1) CSS: вставьте в <style> -->
<style>
  .stack-icons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .stack-icons__item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--color-border);
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  .stack-icons__item:hover {
    background: rgba(255, 0, 110, 0.1);
    border-color: var(--accent-pink);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255, 0, 110, 0.25);
  }
  .stack-icons__item svg { display: block; }
</style>
